name: CI standard

# This repository's settings for the organization's reusable CI pipeline
# (AgentsKit-io/.github, docs/ci.md). Called by ci.yml.

on:
  workflow_call:
    outputs:
      mode:
        description: Pipeline mode (draft, light, pr, full, seed or skip).
        value: ${{ jobs.standard.outputs.mode }}

permissions: {}

jobs:
  standard:
    uses: AgentsKit-io/.github/.github/workflows/ci.yml@a92528f9e3db3c41a7a8a10cd96754efeed7f00c
    permissions:
      actions: write
      contents: read
    with:
      installer: auto
      typecheck-command: bash scripts/ci/check.sh
      test-command: npx vitest run
      build-command: bash scripts/ci/build.sh
      job-timeout-minutes: 15

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main and scheduled runs always finish.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/ci-standard.yml
    permissions:
      actions: write
      contents: read

  # Keeps the required check name: green only when every pipeline stage passed.
  verify:
    needs: pipeline
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Pipeline result
        env:
          RESULT: ${{ needs.pipeline.result }}
          MODE: ${{ needs.pipeline.outputs.mode }}
        run: |
          echo "pipeline: $RESULT (mode: ${MODE:-unknown})"
          test "$RESULT" = success
